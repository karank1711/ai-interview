<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>InterviewIQ - AI-Powered Mock Interview Platform</title>
    <script>
      (function () {
        try {
          var raw = localStorage.getItem('interviewiq-settings');
          var theme = raw ? (JSON.parse(raw) || {}).theme : 'light';
          var dark = theme === 'dark' || (theme === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var value = dark ? 'dark' : 'light';
          document.documentElement.setAttribute('data-theme', value);
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = value;
        } catch (e) {}
      })();
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="root"></div>
    <script src="/runtime-api.js"></script>
    <script>
      (function () {
        var raw = String(window.__INTERVIEWIQ_RUNTIME_API_URL__ || '').replace(/\/+$/, '');
        var resolved = !raw ? '' : /\/api$/.test(raw) ? raw : raw + '/api';
        window.__INTERVIEWIQ_API__ = window.__INTERVIEWIQ_API__ || {
          resolved: resolved,
          source: 'html-boot',
          pageHost: location.hostname
        };
        console.info('[InterviewIQ] API boot', window.__INTERVIEWIQ_API__.resolved, window.__INTERVIEWIQ_API__);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
